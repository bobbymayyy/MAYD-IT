name: Bootstrap dependency lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  lockfile:
    name: Generate initial package-lock.json
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: false

      - name: Refuse to replace an existing lockfile
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            echo "::error::package-lock.json already exists. Dependency changes must arrive through reviewed PRs."
            exit 1
          fi

      - name: Verify toolchain
        run: node scripts/check-toolchain.mjs

      - name: Resolve dependency graph without executing package code
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify only the lockfile changed
        shell: bash
        run: |
          git diff --exit-code -- package.json apps/site/package.json apps/arcade/package.json .npmrc .nvmrc
          test -f package-lock.json

      - name: Commit generated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock npm dependency graph"
          git push
