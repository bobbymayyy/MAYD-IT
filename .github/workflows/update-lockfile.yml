name: Update dependency lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: false

      - name: Update vulnerable transitive dependency
        run: npm update nanoid --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify application manifests were untouched
        run: |
          git diff --exit-code -- \
            package.json \
            apps/site/package.json \
            apps/arcade/package.json

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: update vulnerable nanoid dependency"
          git push
