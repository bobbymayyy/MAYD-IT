name: Update dependency lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: false

      - name: Update vulnerable transitive dependency
        run: npm update nanoid --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify application manifests were untouched
        run: |
          git diff --exit-code -- \
            package.json \
            apps/site/package.json \
            apps/arcade/package.json

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: update vulnerable nanoid dependency"
          git push
